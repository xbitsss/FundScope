[package]
name = "fundscope"
version = "0.1.0"
description = "Local-first mutual fund research desk"
authors = ["FundScope"]
edition = "2021"

[lib]
name = "fundscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
